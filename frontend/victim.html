<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIVARAN - Victim Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="index.html">&larr; Back to Home</a>
        <h2>We are here to listen.</h2>
        <div id="error-banner" style="color: red; margin-bottom: 10px; font-weight: bold;"></div>

        <form id="victim-form">
            <input type="text" id="v-name" placeholder="Your Name" required>
            <input type="number" id="v-age" placeholder="Age" required>
            <input type="text" id="v-gender" placeholder="Gender" required>
            <input type="email" id="v-email" placeholder="Email (Optional)">
            <input type="text" id="v-address" placeholder="Location / Address" required>

            <textarea id="v-statement" rows="4" placeholder="Share what happened in a way that feels comfortable for you..." required></textarea>

            <label>Upload Audio (Optional):</label>
            <input type="file" id="v-audio" accept="audio/*">

            <button type="submit" class="btn primary">Submit Report Securely</button>
        </form>
        <div id="success-msg" style="display:none; color: green; margin-top: 15px; font-weight: bold;"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
