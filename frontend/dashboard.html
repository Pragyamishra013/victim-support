<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NIVARAN Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="container wide">
<a class="back-link" href="org.html">← Organization Portal</a>
<div id="dashboard-auth-message" class="section-box hidden"><h2>Organization session not found</h2><p>Please sign in through the organization portal first.</p><a class="btn" href="org.html">Open Organization Portal</a></div>
