<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIVARAN - Organization Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <a href="index.html">&larr; Back</a>
        <h2>Organization Portal</h2>

        <div id="auth-forms">
            <h3>Login</h3>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn primary">Sign In</button>
            </form>

            <hr style="margin: 20px 0;">

            <h3>Register New NGO</h3>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="NGO Name" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="btn secondary">Register NGO</button>
            </form>
        </div>

        <div id="ngo-dashboard-link" style="display:none;">
            <h3>Welcome, <span id="ngo-title"></span></h3>
            <p>Your Unique Public Reporting Link:</p>
            <input type="text" id="unique-link-display" readonly style="width:100%; padding:8px; margin-bottom:10px;">
            <button id="goto-dash" class="btn primary">Open NGO Dashboard</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
